# EMQX 单服务编排。
# 只调试 MQTT Broker 配置时，在本目录执行 docker compose。
name: iot-mqtt-server

services:
  mqtt:
    image: emqx:5.8.8
    container_name: iot-mqtt-server
    # 当前不需要 env 文件，保留字段作为标准占位；示例：
    # env_file:
    #   - .env
    env_file: []
    # EMQX 使用双下划线环境变量映射嵌套监听配置。
    environment:
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: "/opt/emqx/etc/certs/ca.crt"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: "/opt/emqx/etc/certs/server.crt"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: "/opt/emqx/etc/certs/server.key"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: "verify_peer"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    # 8883 是设备 mTLS 入口；开发端口和 Dashboard/API 只绑定本机。
    ports:
      - "127.0.0.1:1883:1883"
      - "8883:8883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    # Broker 配置和证书只读挂载，避免容器内误改。
    volumes:
      - ./emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ../../certs:/opt/emqx/etc/certs:ro
      # 如需持久化 EMQX 数据，可增加命名卷；示例：
      # - emqx-data:/opt/emqx/data
      # - emqx-log:/opt/emqx/log
    # 默认接入本服务独立网络；如需接入共享网络，可再追加。
    networks:
      - mqtt-net
    restart: unless-stopped

# 暂未配置 EMQX 命名卷；需要持久化时可参考：
# volumes:
#   emqx-data:
#     driver: local
#   emqx-log:
#     driver: local
volumes: {}

networks:
  # 单服务栈使用的独立 bridge 网络；如需使用外部已存在网络可参考：
  # mqtt-net:
  #   external: true
  #   name: iot-shared-net
  mqtt-net:
    driver: bridge
