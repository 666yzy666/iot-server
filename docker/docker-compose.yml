# 根编排文件，用于本地多服务联调。
# 各一级服务目录仍然各自管理 Dockerfile 和单服务 compose。
name: iot-server

services:
  postgres:
    # 本地联调用数据库；生产 Web 后台当前使用宝塔 MySQL。
    image: postgres:16-alpine
    container_name: iot-postgres
    # 当前不需要 env 文件，保留字段作为标准占位；示例：
    # env_file:
    #   - ./postgres/.env
    env_file: []
    environment:
      POSTGRES_DB: iot_server
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot_dev_password
    ports:
      - "5432:5432"
    # 持久化本地联调数据库数据，容器重建后仍保留。
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - iot-net
    restart: unless-stopped

  web-backend:
    # 从服务目录构建镜像，不在根目录重复维护 Dockerfile。
    image: iot-web-backend:latest
    build:
      context: ./web-backend
      dockerfile: Dockerfile
    container_name: iot-web-backend
    # 使用 docker/web-backend/.env 中的运行时配置。
    env_file:
      - ./web-backend/.env
    # 预留给可提交到源码里的非敏感覆盖项；示例：
    # environment:
    #   APP_PORT: "8000"
    #   LOG_LEVEL: "info"
    environment: {}
    # 让容器访问宿主机服务，例如宝塔管理的 MySQL。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 只绑定本机，避免 FastAPI 被绕过反向代理直接访问。
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    # 正常联调部署不挂载目录；需要热更新时可参考：
    # volumes:
    #   - ./web-backend/backend/src:/app/src:ro
    #   - ./web-backend/frontend/dist:/app/frontend/dist:ro
    volumes: []
    # 根编排所有服务默认接入同一个网络；如需隔离可给服务增加专用网络。
    networks:
      - iot-net
    restart: unless-stopped

  mqtt:
    # 用于 MQTT / mTLS 联调的 EMQX Broker。
    image: emqx:5.8.8
    container_name: iot-mqtt-server
    # 当前不需要 env 文件，保留字段作为标准占位；示例：
    # env_file:
    #   - ./mqtt-server/.env
    env_file: []
    # EMQX 使用双下划线环境变量映射嵌套监听配置。
    environment:
      EMQX_LISTENERS__SSL__DEFAULT__BIND: "0.0.0.0:8883"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CACERTFILE: "/opt/emqx/etc/certs/ca.crt"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__CERTFILE: "/opt/emqx/etc/certs/server.crt"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__KEYFILE: "/opt/emqx/etc/certs/server.key"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__VERIFY: "verify_peer"
      EMQX_LISTENERS__SSL__DEFAULT__SSL_OPTIONS__FAIL_IF_NO_PEER_CERT: "true"
    # 8883 是设备 mTLS 入口；开发端口和 Dashboard/API 只绑定本机。
    ports:
      - "127.0.0.1:1883:1883"
      - "8883:8883"
      - "127.0.0.1:8083:8083"
      - "127.0.0.1:18083:18083"
    # Broker 配置和证书只读挂载，避免容器内误改。
    volumes:
      - ./mqtt-server/emqx.conf:/opt/emqx/etc/emqx.conf:ro
      - ../certs:/opt/emqx/etc/certs:ro
      # 如需持久化 EMQX 数据，可增加命名卷；示例：
      # - emqx-data:/opt/emqx/data
      # - emqx-log:/opt/emqx/log
    networks:
      - iot-net
    depends_on:
      - postgres
    restart: unless-stopped

  streaming:
    # 从流媒体服务目录构建镜像。
    image: iot-streaming-server:latest
    build:
      context: ./streaming-server
      dockerfile: Dockerfile
    container_name: iot-streaming-server
    # 当前不需要 env 文件，保留字段作为标准占位；示例：
    # env_file:
    #   - ./streaming-server/.env
    env_file: []
    # 预留给可提交到源码里的非敏感流媒体覆盖项；示例：
    # environment:
    #   NGINX_WORKER_PROCESSES: "auto"
    environment: {}
    # 1935 用于 RTMP 推流，8080 用于 HTTP 状态页和拉流入口。
    ports:
      - "1935:1935"
      - "8080:8080"
    # 只读挂载 Nginx 配置，确保行为由服务目录配置控制。
    volumes:
      - ./streaming-server/nginx.conf:/etc/nginx/nginx.conf:ro
      # 可按需增加日志或媒体目录挂载；示例：
      # - ./streaming-server/logs:/var/log/nginx
      # - ./streaming-server/media:/srv/media
    networks:
      - iot-net
    restart: unless-stopped

volumes:
  # Docker 管理的命名卷，用于保存本地联调数据库数据。
  # 新增命名卷示例：
  # emqx-data:
  #   driver: local
  postgres-data:
    driver: local

networks:
  # 根联调栈共享的 bridge 网络；如需接入外部网络可参考：
  # iot-net:
  #   external: true
  #   name: iot-shared-net
  iot-net:
    driver: bridge
