# Web 后台单服务编排。
# 只部署 FastAPI + Vue 后台页面时，在本目录执行 docker compose。
name: iot-web-backend

services:
  web-backend:
    # 固定镜像名，方便脚本稳定地重新构建和部署。
    image: iot-web-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-web-backend
    # 运行时密钥和环境差异放在 .env，不提交到 git。
    env_file:
      - .env
    # 预留给可以提交到源码里的少量非敏感覆盖项；示例：
    # environment:
    #   APP_PORT: "8000"
    #   LOG_LEVEL: "info"
    environment: {}
    # 使用宿主机网络，容器内可直接通过 127.0.0.1 访问宝塔 MySQL。
    # 注意：host 网络下 ports/networks 不生效，端口暴露由应用监听地址和服务器防火墙控制。
    network_mode: host
    # 如需改回 bridge 网络，可参考：
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    # ports:
    #   - "127.0.0.1:${APP_PORT:-8000}:8000"
    # 正常部署不挂载目录；本地开发需要热更新时可参考：
    # volumes:
    #   - ./backend/src:/app/src:ro
    #   - ./frontend/dist:/app/frontend/dist:ro
    volumes: []
    restart: unless-stopped

# Web 后台自身无状态，暂不需要命名卷。
volumes: {}
