# Web 后台单服务编排。
# 只部署 FastAPI + Vue 后台页面时，在本目录执行 docker compose。
name: iot-web-backend

services:
  web-backend:
    image: iot-web-backend:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iot-web-backend
    env_file:
      - .env
    environment: {}
    network_mode: host
    # 通过 volume 挂载前端产物和后端源码，git pull 后无需 --build。
    # 前端构建通过 bash deploy.sh 或 docker run node ... npm run build 完成。
    volumes:
      - ./frontend/dist:/app/frontend/dist:ro
      - ./backend/src:/app/src:ro
    restart: unless-stopped

volumes: {}
