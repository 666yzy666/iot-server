server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;

    limit_conn stream_conn 10;
    limit_req zone=stream_req burst=40 nodelay;

    location /live/ {
        proxy_set_header X-Device-Cert-Subject $ssl_client_s_dn;
        proxy_set_header X-Device-Cert-Verify $ssl_client_verify;
        proxy_pass http://127.0.0.1:8080/live/;
    }
}
